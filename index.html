<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAnalytics - Adobe Stock Portfolio Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04080f;font-family:'DM Sans',Arial,sans-serif;color:#e2e8f0;min-height:100vh}
nav{padding:16px 32px;background:rgba(8,14,26,.95);border-bottom:1px solid rgba(99,179,237,.15);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:800;color:#76e4f7;letter-spacing:-0.5px}
.badge{padding:6px 14px;background:rgba(104,211,145,.15);border:1px solid rgba(104,211,145,.3);border-radius:20px;font-size:11px;color:#68d391;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:32px;min-height:calc(100vh-80px)}
.title{font-size:32px;font-weight:700;margin-bottom:20px;letter-spacing:-0.5px}
.title span{color:#76e4f7}
.search-box{display:flex;gap:12px;margin-bottom:40px;max-width:700px}
input{flex:1;padding:14px 18px;background:#0c1424;border:1px solid rgba(99,179,237,.2);border-radius:12px;color:#e2e8f0;font-size:14px;font-family:monospace;outline:none;transition:border-color .2s}
input:focus{border-color:#76e4f7;box-shadow:0 0 0 3px rgba(118,228,247,.1)}
button{padding:14px 32px;background:#76e4f7;border:none;border-radius:12px;color:#000;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
button:hover{background:#5dd9f0;transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.status{margin:20px 0;padding:16px;border-radius:12px;font-size:14px;display:none}
.status.show{display:block}
.status.loading{background:rgba(118,228,247,.1);border:1px solid rgba(118,228,247,.3);color:#76e4f7}
.status.success{background:rgba(104,211,145,.1);border:1px solid rgba(104,211,145,.3);color:#68d391}
.status.error{background:rgba(252,129,129,.1);border:1px solid rgba(252,129,129,.3);color:#fc8181}
#profile{display:none;background:#0c1424;border:1px solid rgba(99,179,237,.15);border-radius:16px;padding:28px;margin-bottom:32px}
.profile-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px}
.profile-info h2{font-size:26px;font-weight:700;margin-bottom:6px}
.profile-info p{font-size:12px;color:#718096;font-family:monospace}
.stats{display:flex;gap:32px;flex-wrap:wrap}
.stat{text-align:center}
.stat-val{font-size:32px;font-weight:800;color:#76e4f7;display:block;margin-bottom:4px}
.stat-label{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.05em}
#filters{display:none;margin-bottom:24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:8px 16px;background:#0c1424;border:1px solid rgba(99,179,237,.1);border-radius:8px;color:#718096;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.filter-btn:hover{border-color:rgba(99,179,237,.3);color:#e2e8f0}
.filter-btn.active{background:rgba(99,179,237,.15);border-color:#76e4f7;color:#76e4f7}
#assets{display:none;margin-top:24px}
.assets-count{font-size:13px;color:#718096;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.asset{background:#0c1424;border:1px solid rgba(99,179,237,.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.asset:hover{border-color:#76e4f7;transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.thumb{width:100%;aspect-ratio:4/3;background:rgba(99,179,237,.05);object-fit:cover;display:block}
.info{padding:14px}
.asset-title{font-size:12px;font-weight:500;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#718096;font-family:monospace}
.empty{text-align:center;padding:80px 20px;color:#718096;grid-column:1/-1}
.empty-icon{font-size:64px;margin-bottom:16px}
.empty-text{font-size:16px}
.console{background:#000;border:1px solid rgba(99,179,237,.2);border-radius:8px;padding:12px;margin-top:24px;font-family:monospace;font-size:11px;color:#76e4f7;max-height:150px;overflow-y:auto;display:none}
.console.show{display:block}
@media(max-width:768px){main{padding:16px}.title{font-size:24px}.search-box{flex-direction:column}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.profile-header{flex-direction:column}.stats{gap:16px}}
</style>
</head>
<body>

<nav>
  <div class="logo">StockAnalytics</div>
  <div class="badge">✅ Free Edition</div>
</nav>

<main>
  <div class="title">Contributor <span>Portfolio</span> Tracker</div>
  <div class="search-box">
    <input id="cid" placeholder="Enter Contributor ID (e.g., 212998954)..." autocomplete="off">
    <button id="btn" onclick="track()">Search</button>
  </div>

  <div id="status" class="status"></div>

  <div id="profile">
    <div class="profile-header">
      <div class="profile-info">
        <h2 id="name">—</h2>
        <p id="id"></p>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-val" id="total">0</span><span class="stat-label">Total Assets</span></div>
        <div class="stat"><span class="stat-val" id="photo">0</span><span class="stat-label">Photos</span></div>
        <div class="stat"><span class="stat-val" id="video">0</span><span class="stat-label">Videos</span></div>
        <div class="stat"><span class="stat-val" id="vector">0</span><span class="stat-label">Vectors</span></div>
      </div>
    </div>
  </div>

  <div id="filters">
    <button class="filter-btn active" data-f="all" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" data-f="photo" onclick="setFilter('photo',this)">Photos</button>
    <button class="filter-btn" data-f="video" onclick="setFilter('video',this)">Videos</button>
    <button class="filter-btn" data-f="vector" onclick="setFilter('vector',this)">Vectors</button>
  </div>

  <div id="assets">
    <div class="assets-count">Showing <b id="count">0</b> assets</div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="console" class="console"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const status=(msg,type='loading')=>{
  const s=$('status');
  s.textContent=msg;
  s.className='status show '+type;
};
const log=msg=>{
  const c=$('console');
  c.classList.add('show');
  c.textContent+=(c.textContent?'\n':'')+msg;
  c.scrollTop=c.scrollHeight;
};

let allAssets=[],filtered=[];

async function track(){
  const cid=$('cid').value.trim();
  if(!cid||!/^\d+$/.test(cid)){
    status('❌ Invalid Contributor ID','error');
    return;
  }
  
  status('🔍 Searching for contributor '+cid+'...','loading');
  $('btn').disabled=true;
  log('▶ Starting search for ID: '+cid);
  
  try{
    // Method 1: Direct search page
    log('📍 Method 1: Fetching from search page...');
    const res1=await fetch(`https://stock.adobe.com/search?creator_id=${cid}`,{
      headers:{'User-Agent':'Mozilla/5.0'}
    });
    const html1=await res1.text();
    
    // Extract name
    let name='Unknown Contributor';
    const nameM=html1.match(/<h1[^>]*>([^<]+)<\/h1>/i)||html1.match(/<title>([^<]*)\s*[-|]/i);
    if(nameM){
      name=(nameM[1]||'').split('|')[0].trim();
      log('✅ Found name: '+name);
    }
    
    // Extract data from HTML
    log('📊 Parsing asset data...');
    const assets=[];
    const patterns=[
      /"id":(\d+),"title":"([^"]*)".*?"nb_results":(\d+).*?"creation_date":"([^"]*)".*?"content_type":"([^"]*)"(?:.*?"thumbnail_url":"([^"]*)"|.*?"comp_url":"([^"]*)")?/g,
      /"id":(\d+).*?"title":"([^"]*)".*?"nb_results":(\d+).*?"creation_date":"([^"]*)".*?"content_type":"([^"]*)"(?:.*?"thumbnail_url":"([^"]*)")?/g
    ];
    
    for(let pattern of patterns){
      let m;
      while((m=pattern.exec(html1))){
        assets.push({
          id:m[1],
          title:m[2]||'Untitled',
          downloads:parseInt(m[3])||0,
          date:m[4],
          type:m[5],
          thumb:(m[6]||m[7]||'').replace(/\\\//g,'/')
        });
      }
      if(assets.length>0)break;
    }
    
    log('✅ Found '+assets.length+' assets');
    
    if(!assets.length){
      throw new Error('No assets found. Adobe Stock structure may have changed.');
    }
    
    // Count by type
    const counts={
      photo:assets.filter(a=>a.type==='photo').length,
      video:assets.filter(a=>a.type==='video').length,
      vector:assets.filter(a=>a.type==='zip_vector').length,
      illustration:assets.filter(a=>a.type==='illustration').length,
      template:assets.filter(a=>a.type==='template').length
    };
    
    log('📈 Stats: Photos='+(counts.photo)+', Videos='+(counts.video)+', Vectors='+(counts.vector));
    
    // Update UI
    allAssets=assets;
    filtered=assets;
    
    $('name').textContent=name;
    $('id').textContent='ID: '+cid;
    $('total').textContent=assets.length;
    $('photo').textContent=counts.photo;
    $('video').textContent=counts.video;
    $('vector').textContent=counts.vector;
    $('count').textContent=assets.length;
    
    renderGrid();
    
    $('profile').style.display='block';
    $('filters').style.display='flex';
    $('assets').style.display='block';
    
    status('✅ Found '+assets.length+' assets!','success');
    log('✅ Complete!');
    
  }catch(e){
    log('❌ Error: '+e.message);
    status('❌ Error: '+e.message,'error');
  }finally{
    $('btn').disabled=false;
  }
}

function renderGrid(){
  const grid=$('grid');
  grid.innerHTML='';
  
  if(!filtered.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No assets found with this filter</div></div>';
    return;
  }
  
  filtered.forEach(a=>{
    const d=document.createElement('div');
    d.className='asset';
    d.onclick=()=>window.open(`https://stock.adobe.com/stock-photo/${a.id}`,'_blank');
    const dt=a.date?new Date(a.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit'}):'—';
    const dlStr=(a.downloads||0).toLocaleString();
    d.innerHTML=`
      <img class="thumb" src="${a.thumb}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 150%22%3E%3Crect fill=%22%23222%22 width=%22200%22 height=%22150%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-family=%22Arial%22%3ENo Thumbnail%3C/text%3E%3C/svg%3E'">
      <div class="info">
        <div class="asset-title">${a.title}</div>
        <div class="meta">
          <span>⬇ ${dlStr}</span>
          <span>${dt}</span>
        </div>
      </div>
    `;
    grid.appendChild(d);
  });
}

function setFilter(type,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  
  if(type==='all'){
    filtered=allAssets;
  }else{
    const typeMap={photo:'photo',video:'video',vector:'zip_vector'};
    const t=typeMap[type]||type;
    filtered=allAssets.filter(a=>a.type===t||a.type===type);
  }
  renderGrid();
}

$('cid').addEventListener('keydown',e=>{if(e.key==='Enter')track()});
</script>
</body>
</html>
