<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockAnalytics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04080f;font-family:'DM Sans',Arial,sans-serif;color:#e2e8f0;min-height:100vh}
nav{padding:16px 32px;background:rgba(8,14,26,.9);border-bottom:1px solid rgba(99,179,237,.1);display:flex;justify-content:space-between}
.logo{font-size:20px;font-weight:800;color:#76e4f7}
.badge{padding:6px 14px;background:rgba(104,211,145,.12);border:1px solid rgba(104,211,145,.3);border-radius:20px;font-size:11px;color:#68d391}
main{max-width:1200px;margin:0 auto;padding:32px}
.title{font-size:28px;font-weight:700;margin-bottom:16px}
.title span{color:#76e4f7}
.search-box{display:flex;gap:12px;margin-bottom:32px;max-width:600px}
input{flex:1;padding:14px;background:#0c1424;border:1px solid rgba(99,179,237,.2);border-radius:12px;color:#e2e8f0;font-size:14px;outline:none}
input:focus{border-color:#76e4f7}
button{padding:14px 28px;background:#76e4f7;border:none;border-radius:12px;color:#000;font-weight:700;cursor:pointer}
button:hover{opacity:.9}
button:disabled{opacity:.5}
#profile{display:none;background:#0c1424;border:1px solid rgba(99,179,237,.2);border-radius:16px;padding:24px;margin-bottom:24px}
.profile-header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px}
.profile-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat-val{font-size:24px;font-weight:800;color:#76e4f7}
.stat-label{font-size:11px;color:#718096;text-transform:uppercase}
#assets{display:none;margin-top:24px}
.assets-count{font-size:13px;color:#718096;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.asset{background:#0c1424;border:1px solid rgba(99,179,237,.1);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .2s}
.asset:hover{border-color:#76e4f7}
.thumb{width:100%;aspect-ratio:4/3;background:rgba(99,179,237,.05);object-fit:cover;display:block}
.info{padding:12px}
.asset-title{font-size:12px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#718096}
.empty{text-align:center;padding:60px 20px;color:#718096}
.error{background:rgba(252,129,129,.1);border:1px solid rgba(252,129,129,.3);border-radius:12px;padding:16px;margin:20px 0;color:#fc8181}
.success{background:rgba(104,211,145,.1);border:1px solid rgba(104,211,145,.3);border-radius:12px;padding:16px;margin:20px 0;color:#68d391}
.loading{text-align:center;padding:40px;color:#76e4f7}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(118,228,247,.3);border-top-color:#76e4f7;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.console{background:#000;border:1px solid rgba(99,179,237,.2);border-radius:8px;padding:12px;margin-top:20px;font-family:monospace;font-size:11px;color:#76e4f7;max-height:200px;overflow-y:auto}
</style>
</head>
<body>

<nav>
  <div class="logo">StockAnalytics</div>
  <div class="badge">✅ Free Edition</div>
</nav>

<main>
  <div class="title">Contributor <span>Portfolio</span> Tracker</div>
  <div class="search-box">
    <input id="cid" placeholder="Enter Contributor ID (e.g., 212998954)..." autocomplete="off">
    <button id="btn" onclick="track()">Track</button>
  </div>

  <div id="profile">
    <div class="profile-header">
      <div class="profile-info">
        <h2 id="name">—</h2>
        <p id="id" style="font-size:12px;color:#718096"></p>
      </div>
      <div class="stats">
        <div><div class="stat-val" id="total">0</div><div class="stat-label">Total</div></div>
        <div><div class="stat-val" id="photo">0</div><div class="stat-label">Photos</div></div>
        <div><div class="stat-val" id="video">0</div><div class="stat-label">Videos</div></div>
        <div><div class="stat-val" id="vector">0</div><div class="stat-label">Vectors</div></div>
      </div>
    </div>
  </div>

  <div id="assets">
    <div class="assets-count">Showing <b id="count">0</b> assets</div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="console" class="console" style="display:none"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const log=msg=>{
  const c=$('console');
  c.style.display='block';
  c.textContent+=(c.textContent?'\n':'')+msg;
  c.scrollTop=c.scrollHeight;
};

async function track(){
  const cid=$('cid').value.trim();
  if(!cid){alert('Enter Contributor ID');return}
  
  log('📍 Starting track for ID: '+cid);
  
  $('btn').disabled=true;
  $('btn').textContent='Tracking...';
  $('profile').style.display='none';
  $('assets').style.display='none';
  
  try{
    // Step 1: Get contributor name
    log('🔍 Fetching contributor name...');
    const nameRes=await fetch('https://stock.adobe.com/contributor/'+cid);
    const nameHtml=await nameRes.text();
    const nameMa=nameHtml.match(/<h1[^>]*>([^<]+)<\/h1>/i)||nameHtml.match(/<title>([^<]+)<\/title>/i);
    const name=nameMa?(nameMa[1]||'').split('|')[0].trim():'ID: '+cid;
    log('✅ Name: '+name);
    
    // Step 2: Get counts
    log('📊 Fetching asset counts...');
    const [total,photo,video,vector]=await Promise.all([
      getCount(cid,''),
      getCount(cid,'photo'),
      getCount(cid,'video'),
      getCount(cid,'zip_vector')
    ]);
    log('✅ Total: '+total+', Photos: '+photo+', Videos: '+video+', Vectors: '+vector);
    
    // Step 3: Get assets
    log('🖼️  Fetching assets...');
    const assets=await getAssets(cid);
    log('✅ Got '+assets.length+' assets');
    
    // Display
    $('name').textContent=name;
    $('id').textContent='ID: '+cid;
    $('total').textContent=total;
    $('photo').textContent=photo;
    $('video').textContent=video;
    $('vector').textContent=vector;
    $('count').textContent=assets.length;
    
    const grid=$('grid');
    grid.innerHTML='';
    
    if(!assets.length){
      grid.innerHTML='<div class="empty" style="grid-column:1/-1"><div style="font-size:48px;margin-bottom:12px">🔍</div>No assets found</div>';
    }else{
      assets.slice(0,48).forEach(a=>{
        const d=document.createElement('div');
        d.className='asset';
        d.onclick=()=>window.open('https://stock.adobe.com/stock-photo/'+a.id,'_blank');
        const dt=a.date?new Date(a.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'—';
        d.innerHTML=`<img class="thumb" src="${a.thumb}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 75%22%3E%3Crect fill=%22%23222%22 width=%22100%22 height=%2275%22/%3E%3C/svg%3E'"><div class="info"><div class="asset-title">${a.title}</div><div class="meta"><span>⬇ ${(a.downloads||0).toLocaleString()}</span><span>${dt}</span></div></div>`;
        grid.appendChild(d);
      });
    }
    
    $('profile').style.display='block';
    $('assets').style.display='block';
    log('✅ Done!');
    
  }catch(e){
    log('❌ Error: '+e.message);
    alert('Error: '+e.message);
  }
  
  $('btn').disabled=false;
  $('btn').textContent='Track';
}

async function getCount(cid,type){
  try{
    let url='https://stock.adobe.com/search?creator_id='+cid;
    if(type)url+='&filters[content_type:'+type+']=1';
    const r=await fetch(url);
    const h=await r.text();
    const m=h.match(/"estimated"\s*:\s*(\d+)|"totalResults"\s*:\s*(\d+)/i);
    return m?parseInt(m[1]||m[2]||0):0;
  }catch{return 0}
}

async function getAssets(cid){
  try{
    const url='https://stock.adobe.com/search?creator_id='+cid+'&limit=100';
    const r=await fetch(url);
    const h=await r.text();
    const assets=[];
    const regex=/"id":(\d+),"title":"([^"]*)","nb_results":(\d+),"creation_date":"([^"]*)","content_type":"([^"]*)"(?:.*?"thumbnail_url":"([^"]*)")?/g;
    let m;
    while((m=regex.exec(h))){
      assets.push({
        id:m[1],
        title:m[2]||'Untitled',
        downloads:parseInt(m[3])||0,
        date:m[4],
        type:m[5],
        thumb:(m[6]||'').replace(/\\\//g,'/')
      });
    }
    return assets;
  }catch(e){
    log('Asset fetch error: '+e.message);
    return [];
  }
}

$('cid').addEventListener('keydown',e=>{if(e.key==='Enter')track()});
</script>
</body>
</html>
